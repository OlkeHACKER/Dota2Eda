<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — FoodExpress</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth">
        <div class="auth-card">
            <a href="index.html" class="logo">FoodExpress</a>
            <h1>Создать аккаунт</h1>

            <form id="registerForm" novalidate>
                <p class="form-message" id="registerMessage" role="alert"></p>
                <div class="field">
                    <label for="name">Имя</label>
                    <input type="text" id="name" name="name" required>
                    <div class="field-error" id="nameError">Введите имя</div>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                    <div class="field-error" id="emailError">Введите корректный email</div>
                </div>

                <div class="field">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required minlength="6">
                    <div class="field-error" id="passwordError">Пароль минимум 6 символов</div>
                </div>

                <div class="field">
                    <label for="role">Регистрируюсь как</label>
                    <select id="role" name="role">
                        <option value="CUSTOMER">Покупатель</option>
                        <option value="RESTAURANT_ADMIN">Ресторан / кафе</option>
                    </select>
                </div>

                <div class="field" id="restaurant-fields" hidden>
                    <label for="restaurantName">Название ресторана</label>
                    <input type="text" id="restaurantName" name="restaurantName">
                    <label for="cuisine">Кухня</label>
                    <input type="text" id="cuisine" name="cuisine">
                </div>

                <button type="submit" class="btn btn--primary btn--full">Зарегистрироваться</button>
            </form>

            <p class="auth-switch">Уже есть аккаунт? <a href="login.html">Войти</a></p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
